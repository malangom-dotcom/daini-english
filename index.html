<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다인이의 영어 학습</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f3f0e7;
      color: #2f3b2f;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      background: #fffdf7;
      position: relative;
      overflow: hidden;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      background: rgba(255, 253, 247, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #e8e2d3;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
    }

    .coin-box {
      background: #fff3b0;
      border: 2px solid #e8c94f;
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 800;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .page {
      padding: 22px 18px 110px;
    }

    .day-badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: #dff0d4;
      color: #2f6b35;
      font-weight: 800;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.2;
    }

    .sub {
      color: #6d756d;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .sentence-card {
      background: white;
      border: 1px solid #e6e3db;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
    }

    .sentence-num {
      font-size: 13px;
      color: #5f8559;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .english {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .korean {
      font-size: 15px;
      color: #6d756d;
      line-height: 1.5;
    }

    .speak-btn {
      margin-top: 12px;
      border: 0;
      background: #eef6ea;
      color: #2e6b35;
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .bottom-game {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 36px);
      max-width: 484px;
      z-index: 30;
    }

    .game-btn {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 17px;
      font-size: 18px;
      font-weight: 900;
      background: #4d8f55;
      color: white;
      box-shadow: 0 10px 28px rgba(44, 95, 51, 0.25);
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .map-page {
      min-height: 100vh;
      background:
        linear-gradient(rgba(39,67,42,0.18), rgba(39,67,42,0.18)),
        radial-gradient(circle at 20% 20%, #b9d7a8 0 12%, transparent 13%),
        radial-gradient(circle at 80% 35%, #9cc18f 0 10%, transparent 11%),
        linear-gradient(#d8ebcb, #b7d6a9);
      padding: 18px 14px 120px;
      position: relative;
    }

    .map-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .back-btn {
      border: 0;
      background: rgba(255,255,255,0.9);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
    }

    .map-title {
      font-size: 22px;
      font-weight: 900;
    }

    .map {
      position: relative;
      width: 100%;
      min-height: 1850px;
      padding-top: 20px;
    }

    .path-line {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      top: 35px;
      bottom: 35px;
      background: rgba(255,255,255,0.58);
      border-radius: 999px;
    }

    .day-node {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: #8eb57e;
      color: white;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 12px rgba(0,0,0,0.14);
    }

    .day-node.big {
      width: 64px;
      height: 64px;
      background: #5b8d51;
      font-size: 15px;
    }

    .day-node.current {
      background: #f1b84b;
      color: #4a3a13;
      transform: translateX(-50%) scale(1.12);
    }

    .day-node.done {
      background: #4c8a50;
    }

    .shop {
      position: absolute;
      left: calc(50% + 70px);
      background: #fff;
      border-radius: 14px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 5px 14px rgba(0,0,0,0.12);
    }

    .capy {
      position: absolute;
      left: calc(50% - 72px);
      font-size: 42px;
      transform: translateY(-5px);
      filter: drop-shadow(0 5px 4px rgba(0,0,0,0.15));
    }

    .quest-panel {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 488px;
      background: rgba(255,255,255,0.96);
      padding: 14px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.18);
      z-index: 40;
    }

    .quest-btn {
      width: 100%;
      border: 0;
      background: #365f3b;
      color: white;
      padding: 15px;
      border-radius: 15px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.48);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-card {
      width: 100%;
      max-width: 470px;
      background: white;
      border-radius: 24px;
      padding: 22px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .test-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .test-info {
      color: #6d756d;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .question {
      padding: 16px;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      margin-bottom: 12px;
    }

    .q-num {
      font-size: 13px;
      font-weight: 800;
      color: #4b7d51;
      margin-bottom: 8px;
    }

    .q-text {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .mic-btn {
      width: 100%;
      border: 0;
      background: #edf5eb;
      color: #2f6b35;
      border-radius: 12px;
      padding: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .heard {
      font-size: 13px;
      margin-top: 8px;
      color: #666;
      min-height: 20px;
    }

    .pass {
      color: #267a31;
      font-weight: 800;
    }

    .fail {
      color: #b13a3a;
      font-weight: 800;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .secondary,
    .primary {
      flex: 1;
      border: 0;
      padding: 13px;
      border-radius: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .secondary {
      background: #eee;
    }

    .primary {
      background: #4d8f55;
      color: white;
    }

    .result {
      text-align: center;
      padding: 16px 0 4px;
    }

    .result-big {
      font-size: 56px;
      margin-bottom: 8px;
    }

    .result-title {
      font-size: 25px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .result-desc {
      color: #666;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="app">

  <div id="studyScreen">
    <div class="topbar">
      <div class="title">다인이의 영어 학습</div>
      <div class="coin-box">🪙 <span id="coinCount">0</span></div>
    </div>

    <div class="page">
      <div class="day-badge" id="studyDayBadge">DAY 1</div>
      <h1>오늘의 3문장</h1>
      <div class="sub">
        문장을 보고 소리 내어 따라 말해보세요.<br>
        다 공부했다면 아래 게임 버튼을 눌러 퀘스트에 도전하세요.
      </div>

      <div id="sentenceList"></div>
    </div>

    <div class="bottom-game">
      <button class="game-btn" onclick="openMap()">🌲 오늘의 게임 시작</button>
    </div>
  </div>


  <div id="mapScreen" class="hidden">
    <div class="map-page">
      <div class="map-header">
        <button class="back-btn" onclick="closeMap()">←</button>
        <div class="map-title">영어 숲 대모험</div>
        <div class="coin-box">🪙 <span id="mapCoinCount">0</span></div>
      </div>

      <div class="map" id="map">
        <div class="path-line"></div>
      </div>
    </div>

    <div class="quest-panel">
      <button class="quest-btn" onclick="startQuest()">
        🎤 오늘의 3문장 퀘스트
      </button>
    </div>
  </div>

</div>


<div id="testModal" class="modal hidden">
  <div class="modal-card">
    <div id="testContent">
      <div class="test-title">🎤 말하기 퀘스트</div>
      <div class="test-info">
        오늘 배운 문장 3개를 차례대로 말해보세요.<br>
        각 문제의 마이크 버튼을 누른 뒤 문장을 말하면 됩니다.
      </div>

      <div id="questionList"></div>

      <div class="modal-actions">
        <button class="secondary" onclick="closeTest()">닫기</button>
        <button class="primary" onclick="checkQuest()">결과 확인</button>
      </div>
    </div>

    <div id="resultContent" class="hidden"></div>
  </div>
</div>


<script>
  const lessonData = [
    {
      day: 1,
      sentences: [
        {
          en: "I like apples.",
          ko: "나는 사과를 좋아해."
        },
        {
          en: "This is my book.",
          ko: "이것은 내 책이야."
        },
        {
          en: "I can swim.",
          ko: "나는 수영할 수 있어."
        }
      ]
    },
    {
      day: 2,
      sentences: [
        {
          en: "I have a dog.",
          ko: "나는 강아지를 키워."
        },
        {
          en: "She is my friend.",
          ko: "그녀는 내 친구야."
        },
        {
          en: "Open the door, please.",
          ko: "문을 열어 주세요."
        }
      ]
    },
    {
      day: 3,
      sentences: [
        {
          en: "I am hungry.",
          ko: "나는 배고파."
        },
        {
          en: "It is sunny today.",
          ko: "오늘은 날씨가 맑아."
        },
        {
          en: "Let's go to school.",
          ko: "학교에 가자."
        }
      ]
    }
  ];

  let currentDay = Number(localStorage.getItem("currentDay")) || 1;
  let coins = Number(localStorage.getItem("coins")) || 0;

  let answers = [false, false, false];

  function getLesson() {
    return lessonData.find(x => x.day === currentDay) || lessonData[0];
  }

  function renderStudy() {
    const lesson = getLesson();

    document.getElementById("studyDayBadge").textContent = "DAY " + currentDay;
    document.getElementById("coinCount").textContent = coins;
    document.getElementById("mapCoinCount").textContent = coins;

    const list = document.getElementById("sentenceList");
    list.innerHTML = "";

    lesson.sentences.forEach((s, i) => {
      const div = document.createElement("div");
      div.className = "sentence-card";

      div.innerHTML = `
        <div class="sentence-num">문장 ${i + 1}</div>
        <div class="english">${s.en}</div>
        <div class="korean">${s.ko}</div>
        <button class="speak-btn" onclick="speakText('${escapeQuote(s.en)}')">
          🔊 문장 듣기
        </button>
      `;

      list.appendChild(div);
    });
  }

  function escapeQuote(text) {
    return text.replace(/'/g, "\\'");
  }

  function speakText(text) {
    if (!("speechSynthesis" in window)) {
      alert("이 브라우저에서는 음성 재생을 지원하지 않습니다.");
      return;
    }

    speechSynthesis.cancel();

    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "en-US";
    utter.rate = 0.85;

    speechSynthesis.speak(utter);
  }

  function openMap() {
    document.getElementById("studyScreen").classList.add("hidden");
    document.getElementById("mapScreen").classList.remove("hidden");

    renderMap();

    setTimeout(() => {
      const currentNode = document.getElementById("day-" + currentDay);
      if (currentNode) {
        currentNode.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      }
    }, 100);
  }

  function closeMap() {
    document.getElementById("mapScreen").classList.add("hidden");
    document.getElementById("studyScreen").classList.remove("hidden");
  }

  function renderMap() {
    const map = document.getElementById("map");

    map.querySelectorAll(".day-node, .shop, .capy").forEach(el => el.remove());

    const spacing = 90;

    for (let day = 1; day <= 100; day++) {
      const node = document.createElement("div");

      node.className = "day-node";
      node.id = "day-" + day;

      if (day % 10 === 0) {
        node.classList.add("big");
      }

      if (day < currentDay) {
        node.classList.add("done");
      }

      if (day === currentDay) {
        node.classList.add("current");
      }

      node.style.top = (day * spacing) + "px";
      node.textContent = day;

      map.appendChild(node);

      if (day % 10 === 0) {
        const shop = document.createElement("div");
        shop.className = "shop";
        shop.style.top = (day * spacing + 8) + "px";
        shop.innerHTML = "🏪 편의점";
        map.appendChild(shop);
      }
    }

    const capy = document.createElement("div");
    capy.className = "capy";
    capy.style.top = (currentDay * spacing) + "px";
    capy.textContent = "🦫";

    map.appendChild(capy);

    map.style.minHeight = (100 * spacing + 180) + "px";
  }

  function startQuest() {
    answers = [false, false, false];

    const lesson = getLesson();
    const list = document.getElementById("questionList");

    list.innerHTML = "";

    lesson.sentences.forEach((s, i) => {
      const q = document.createElement("div");
      q.className = "question";

      q.innerHTML = `
        <div class="q-num">문제 ${i + 1}</div>
        <div class="q-text">${s.en}</div>

        <button
          class="mic-btn"
          id="mic-${i}"
          onclick="listenSentence(${i})"
        >
          🎤 눌러서 말하기
        </button>

        <div class="heard" id="heard-${i}">
          아직 말하지 않았어요.
        </div>
      `;

      list.appendChild(q);
    });

    document.getElementById("resultContent").classList.add("hidden");
    document.getElementById("testContent").classList.remove("hidden");
    document.getElementById("testModal").classList.remove("hidden");
  }

  function closeTest() {
    document.getElementById("testModal").classList.add("hidden");
  }

  function normalize(text) {
    return text
      .toLowerCase()
      .replace(/[.,!?']/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function listenSentence(index) {
    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert(
        "음성 인식 기능을 사용할 수 없습니다. 안드로이드 Chrome에서 실행해 주세요."
      );
      return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 3;

    const btn = document.getElementById("mic-" + index);
    const heard = document.getElementById("heard-" + index);

    btn.textContent = "🎧 듣는 중...";
    heard.textContent = "문장을 말해보세요.";

    recognition.onresult = function(event) {
      const spoken = event.results[0][0].transcript;
      const target = getLesson().sentences[index].en;

      const spokenN = normalize(spoken);
      const targetN = normalize(target);

      const targetWords = targetN.split(" ");
      const spokenWords = spokenN.split(" ");

      let matched = 0;

      targetWords.forEach(word => {
        if (spokenWords.includes(word)) {
          matched++;
        }
      });

      const score = matched / targetWords.length;

      answers[index] = score >= 0.75;

      if (answers[index]) {
        heard.innerHTML =
          `<span class="pass">✅ 통과</span><br>인식: ${spoken}`;
      } else {
        heard.innerHTML =
          `<span class="fail">❌ 다시 말해보세요</span><br>인식: ${spoken}`;
      }

      btn.textContent = "🎤 다시 말하기";
    };

    recognition.onerror = function(event) {
      btn.textContent = "🎤 다시 말하기";

      if (event.error === "not-allowed") {
        alert(
          "마이크 권한이 허용되지 않았습니다.\nChrome 주소창의 사이트 설정에서 마이크 권한을 허용해 주세요."
        );
      } else {
        heard.textContent = "음성을 인식하지 못했습니다. 다시 시도해 주세요.";
      }
    };

    recognition.start();
  }

  function checkQuest() {
    const success = answers.every(x => x === true);

    const result = document.getElementById("resultContent");
    const test = document.getElementById("testContent");

    test.classList.add("hidden");
    result.classList.remove("hidden");

    if (success) {
      coins += 10;

      if (currentDay < 100) {
        currentDay++;
      }

      localStorage.setItem("coins", coins);
      localStorage.setItem("currentDay", currentDay);

      result.innerHTML = `
        <div class="result">
          <div class="result-big">🎉</div>
          <div class="result-title">퀘스트 성공!</div>

          <div class="result-desc">
            오늘의 3문장을 모두 통과했어요.<br>
            <strong>🪙 10코인</strong>을 획득했습니다.<br><br>
            다음 목적지는 <strong>DAY ${currentDay}</strong>!
          </div>

          <div class="modal-actions">
            <button class="primary" onclick="finishSuccess()">
              다음 DAY로 이동
            </button>
          </div>
        </div>
      `;
    } else {
      result.innerHTML = `
        <div class="result">
          <div class="result-big">🌱</div>
          <div class="result-title">조금만 더 연습해요</div>

          <div class="result-desc">
            세 문장을 모두 통과해야 다음 DAY로 이동할 수 있어요.
          </div>

          <div class="modal-actions">
            <button class="secondary" onclick="closeTest()">
              닫기
            </button>

            <button class="primary" onclick="startQuest()">
              다시 도전
            </button>
          </div>
        </div>
      `;
    }
  }

  function finishSuccess() {
    closeTest();
    renderStudy();
    renderMap();

    setTimeout(() => {
      const currentNode = document.getElementById("day-" + currentDay);

      if (currentNode) {
        currentNode.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      }
    }, 150);
  }

  renderStudy();
</script>

</body>
</html>
